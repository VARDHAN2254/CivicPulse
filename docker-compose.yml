# ==============================================================================
# CivicPulse — Full Infrastructure & Micro-Service Stack
# Services:
#  1. civicpulse-postgres   - PostgreSQL 16 relational database
#  2. civicpulse-redis      - Redis 7 cache, rate-limiting & fast session store
#  3. civicpulse-kafka      - Apache Kafka (KRaft mode) event streaming broker
#  4. civicpulse-backend    - Spring Boot 3 Java 21 REST & WebSocket API
#  5. civicpulse-frontend   - Next.js 14 Web Application
#  6. civicpulse-prometheus - Prometheus metrics scraper
#  7. civicpulse-grafana    - Grafana visualization dashboards
# ==============================================================================

networks:
  civicpulse-network:
    driver: bridge

volumes:
  postgres_data:
    name: civicpulse_postgres_data
  redis_data:
    name: civicpulse_redis_data
  kafka_data:
    name: civicpulse_kafka_data
  prometheus_data:
    name: civicpulse_prometheus_data
  grafana_data:
    name: civicpulse_grafana_data

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  civicpulse-postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse_secure_password_dev_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicpulse_user} -d ${POSTGRES_DB:-civicpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Fast State & Rate Limiter
  # ----------------------------------------------------------------------------
  civicpulse-redis:
    image: redis:7-alpine
    container_name: civicpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-civicpulse_redis_pass_dev_2026}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-civicpulse_redis_pass_dev_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 3. Apache Kafka (KRaft Mode, No ZooKeeper Required)
  # ----------------------------------------------------------------------------
  civicpulse-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: civicpulse-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://civicpulse-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@civicpulse-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 4. Spring Boot 3 Java 21 Backend API
  # ----------------------------------------------------------------------------
  civicpulse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://civicpulse-postgres:5432/${POSTGRES_DB:-civicpulse_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicpulse_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse_secure_password_dev_2026}
      SPRING_DATA_REDIS_HOST: civicpulse-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: civicpulse-kafka:29092
      MAIL_HOST: ${MAIL_HOST:-civicpulse-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@civicpulse.org}
      MAIL_TLS: ${MAIL_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      QR_TOKEN_SECRET_KEY: ${QR_TOKEN_SECRET_KEY:-9d8a7c6b5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    ports:
      - "8080:8080"
    depends_on:
      civicpulse-postgres:
        condition: service_healthy
      civicpulse-redis:
        condition: service_healthy
      civicpulse-mailpit:
        condition: service_started
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 5. Next.js 14 Frontend Application
  # ----------------------------------------------------------------------------
  civicpulse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - civicpulse-backend
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 6. Prometheus Metrics Server
  # ----------------------------------------------------------------------------
  civicpulse-prometheus:
    image: prom/prometheus:v2.50.0
    container_name: civicpulse-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 7. Grafana Metrics Visualization
  # ----------------------------------------------------------------------------
  civicpulse-grafana:
    image: grafana/grafana:10.3.3
    container_name: civicpulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-civicpulse_grafana_admin_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - civicpulse-prometheus
    networks:
      - civicpulse-network

  # ----------------------------------------------------------------------------
  # 8. Mailpit (Local Development & Testing Mailbox Server)
  # ----------------------------------------------------------------------------
  civicpulse-mailpit:
    image: axllent/mailpit:latest
    container_name: civicpulse-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Web UI & REST API for inspection
      - "127.0.0.1:1025:1025" # Local SMTP server
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: "" # In-memory storage for test runs
    networks:
      - civicpulse-network
